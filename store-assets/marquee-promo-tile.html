<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marquee Promo Tile - 1400x560</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1400px;
      height: 560px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .marquee {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 80px;
      position: relative;
    }
    .left-content {
      flex: 1;
      color: white;
      z-index: 2;
    }
    .icon {
      font-size: 100px;
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }
    h1 {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 15px;
      text-shadow: 0 4px 8px rgba(0,0,0,0.2);
      line-height: 1.2;
    }
    .tagline {
      font-size: 28px;
      opacity: 0.95;
      margin-bottom: 30px;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .features {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.15);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: 18px;
      font-weight: 500;
    }
    .feature-icon {
      font-size: 32px;
    }
    .right-content {
      width: 500px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .demo-canvas {
      width: 450px;
      height: 400px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .demo-canvas svg {
      width: 100%;
      height: 100%;
    }
    .badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.25);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="marquee">
    <div class="badge">FREE</div>
    <div class="left-content">
      <div class="icon">🎨</div>
      <h1>SVG Tracer<br>& Creator</h1>
      <div class="tagline">Professional Vector Graphics Made Easy</div>
      <div class="features">
        <div class="feature">
          <span class="feature-icon">✏️</span>
          <span>Pen Tablet Support</span>
        </div>
        <div class="feature">
          <span class="feature-icon">🔤</span>
          <span>Text to SVG</span>
        </div>
        <div class="feature">
          <span class="feature-icon">🖼️</span>
          <span>Image Tracing</span>
        </div>
        <div class="feature">
          <span class="feature-icon">⚡</span>
          <span>Instant Export</span>
        </div>
        <div class="feature">
          <span class="feature-icon">🔒</span>
          <span>100% Offline</span>
        </div>
        <div class="feature">
          <span class="feature-icon">🎯</span>
          <span>Zero Tracking</span>
        </div>
      </div>
    </div>
    <div class="right-content">
      <div class="demo-canvas">
        <svg viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="white"/>
          <!-- Artistic demo drawing -->
          <path d="M 50 150 Q 100 50, 200 100 T 350 150" stroke="#e74c3c" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M 80 200 Q 150 150, 250 180 T 370 220" stroke="#3498db" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M 60 270 Q 130 240, 230 260 T 360 290" stroke="#2ecc71" stroke-width="7" fill="none" stroke-linecap="round"/>
          <circle cx="80" cy="80" r="35" fill="#f39c12" opacity="0.7"/>
          <circle cx="350" cy="320" r="30" fill="#9b59b6" opacity="0.7"/>
          <rect x="180" y="40" width="40" height="40" fill="#e67e22" opacity="0.8" rx="5"/>
          <text x="200" y="200" font-family="Arial" font-size="48" fill="#2c3e50" text-anchor="middle" opacity="0.3">SVG</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
