<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Small Promo Tile - 440x280</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px;
      height: 280px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .tile {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: white;
      text-align: center;
      position: relative;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .tagline {
      font-size: 16px;
      opacity: 0.95;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .features {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    .feature-icon {
      font-size: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="tile">
    <div class="icon">🎨</div>
    <h1>SVG Creator</h1>
    <div class="tagline">Draw • Text • Trace</div>
    <div class="features">
      <div class="feature-icon">✏️</div>
      <div class="feature-icon">🔤</div>
      <div class="feature-icon">🖼️</div>
    </div>
  </div>
</body>
</html>
